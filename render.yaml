services:
  - type: web
    name: omni-privacy-agent
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PUBLIC_APP_URL
        value: https://omni-privacy-agent.onrender.com
      - key: BREVO_SMTP_KEY
        sync: false
